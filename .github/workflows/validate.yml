name: Validate public artifacts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-validation:
    name: >-
      ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'automation/submission-')
          && 'automated-submission-shadow-validation' || 'deterministic-validation' }}
    if: >-
      github.event_name != 'pull_request' ||
      !startsWith(github.head_ref, 'automation/submission-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pytest, not `unittest discover`: most of the suite is plain test_* functions, which
      # unittest collects none of. It reported OK on 31 of 145 tests and named no skips.
      - name: Install test dependencies
        run: python3 -m pip install --quiet pytest
      - name: Run unit tests
        run: python3 -m pytest tests -q
      - name: Check Python sources
        run: python3 -m py_compile processing/*.py
      # Every generated path is redirected into the tmpdir. Leaving one at its default made
      # the check overwrite the working tree and then compare nothing.
      - name: Reproduce merged artifacts without an LLM
        run: |
          tmpdir="$(mktemp -d)"
          python3 processing/merge_index.py \
            --site "$tmpdir/index.json" \
            --site-slim "$tmpdir/site-slim.json" \
            --site-detail-dir "$tmpdir/detail" \
            --site-verify-dir "$tmpdir/verify" \
            --llm "$tmpdir/llm.txt"
          cmp site/public/index.json "$tmpdir/index.json"
          cmp site/public/site-index.json "$tmpdir/site-slim.json"
          cmp site/public/llm.txt "$tmpdir/llm.txt"
          # diff -r, not cmp: this is a directory, and the comparison has to fail on a file
          # present on one side only -- a skill dropped from the index leaves its grounding
          # behind, and a stale file serves forever without ever mismatching anything.
          diff -r site/public/detail "$tmpdir/detail"
          diff -r site/public/verify "$tmpdir/verify"
