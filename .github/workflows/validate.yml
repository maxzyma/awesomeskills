name: Validate public artifacts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check Python sources
        run: python3 -m py_compile processing/*.py
      - name: Reproduce merged artifacts without an LLM
        run: |
          tmpdir="$(mktemp -d)"
          python3 processing/merge_index.py \
            --index "$tmpdir/index.json" \
            --site "$tmpdir/site-index.json" \
            --llm "$tmpdir/llm.txt"
          cmp registry/index.json "$tmpdir/index.json"
          cmp site/public/index.json "$tmpdir/site-index.json"
          cmp site/public/llm.txt "$tmpdir/llm.txt"
