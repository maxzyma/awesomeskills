name: Process skill submission

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: submission-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-and-propose:
    if: contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate issue and maintain draft PR
        id: submission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 processing/submission_action.py
      - name: Build deterministic assessment on the proposal branch
        id: build
        if: steps.submission.outputs.status == 'pass'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROPOSAL_BRANCH: ${{ steps.submission.outputs.branch }}
          SOURCE_REPO: ${{ steps.submission.outputs.repo }}
        run: |
          git fetch origin "$PROPOSAL_BRANCH"
          git checkout --force -B "$PROPOSAL_BRANCH" "origin/$PROPOSAL_BRANCH"
          python3 processing/build_index.py --only-source "$SOURCE_REPO"
          python3 processing/merge_index.py
          python3 -m pip install --quiet pytest
          python3 -m pytest tests -q
          python3 -m py_compile processing/*.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # site-index.json and the detail tree are what the browser actually reads.
          # Omitting them committed a fresh index.json beside a stale site, and the next
          # validate run would fail on the mismatch it had itself created.
          git add registry/base-index.json \
            site/public/index.json site/public/site-index.json \
            site/public/detail site/public/verify \
            site/public/llm.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: assess submission #${{ github.event.issue.number }}"
            git push origin "HEAD:$PROPOSAL_BRANCH"
          fi
      - name: Report deterministic build success
        if: steps.submission.outputs.status == 'pass' && steps.build.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          published=0
          for attempt in 1 2 3 4 5; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
              -f state=success \
              -f context=deterministic-validation \
              -f description='Full deterministic assessment passed' \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              && { published=1; break; }
            sleep "$((attempt * 2))"
          done
          test "$published" -eq 1 || echo '::warning::Could not publish deterministic-validation commit status'
          python3 processing/submission_action.py --build-success
      - name: Report deterministic build failure
        if: steps.submission.outputs.status == 'pass' && steps.build.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          published=0
          for attempt in 1 2 3 4 5; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
              -f state=failure \
              -f context=deterministic-validation \
              -f description='Full deterministic assessment failed' \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              && { published=1; break; }
            sleep "$((attempt * 2))"
          done
          test "$published" -eq 1 || echo '::warning::Could not publish deterministic-validation commit status'
          python3 processing/submission_action.py --build-failure
