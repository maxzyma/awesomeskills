name: Deploy site to Pages

# Publishes site/public/ (human browser + generated index.json + llm.txt) to GitHub Pages.
# The finder skill reads index.json from the raw URL, so it does not depend on this;
# Pages is the human-facing front + eventual awsomeskills.io home.

on:
  push:
    branches: [main]
    paths:
      - "site/public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
      - id: deployment
        uses: actions/deploy-pages@v4
