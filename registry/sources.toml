[[source]]
id   = "K-Dense-AI/scientific-agent-skills"
kind = "skill-collection"
note = """Scientific domain skills (biology/chemistry/medicine) — widens coverage beyond \
the dev-tooling skew of batches 1-3. Only org-backed candidate of the batch: 47 \
contributors, 315-day history. 165 SKILL.md exceeds the per-repo cap, so collection \
coverage stays incomplete and says so. Repo description carries marketing claims \
("#1", "190,000+ scientists") — not treated as signal."""

