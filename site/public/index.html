<!doctype html>

<head>

<title>awesomeskills — a trust-first index of public agent skills</title>
<style>

  * { box-sizing: border-box; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  p.lede { color: var(--body); margin: 6px 0 0; font-size: 15px; max-width: 720px; }
  em { color: var(--accent); font-style: normal; font-weight: 600; }
  .lang-switch { position: absolute; top: 30px; right: 24px; display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .lang-switch button { border: none; background: none; cursor: pointer; color: var(--muted); font: inherit; font-size: 12px; padding: 4px 10px; }
  .lang-switch button.on { background: #eef0fb; color: var(--accent); font-weight: 600; }

  .bar { max-width: 960px; margin: 18px auto 0; padding: 0 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  input[type=search] { flex: 1; min-width: 200px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 7px; font: inherit; color: var(--fg); }
  input[type=search]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(55,48,163,.12); }
  label.chk { color: var(--muted); font-size: 14px; display: inline-flex; gap: 5px; align-items: center; }
  .meta { max-width: 960px; margin: 8px auto 0; padding: 0 24px; color: var(--muted); font-size: 13px; }
  main { max-width: 960px; margin: 6px auto 44px; padding: 0 24px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .row { padding: 15px 0; border-bottom: 1px solid var(--line); }
  .rowmain { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: baseline; }
  .name { font-size: 16px; font-weight: 650; margin: 0; }
  .name a { color: var(--fg); text-decoration: none; }
  .name a:hover { text-decoration: underline; }
  .repo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); margin-left: 8px; font-weight: 500; }
  .kind { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .summary { color: var(--body); font-size: 14px; margin-top: 3px; }

  .signals { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 6px; border: none; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .pill.health { background: #f1f2f6; color: #4b5563; display: inline-flex; align-items: center; gap: 4px; }
  .pi { pointer-events: none; }
  .pill .pi { width: 13px; height: 13px; }
  .pill.icon-only { padding: 3px 7px; }
  .pill.grade { display: inline-flex; align-items: center; gap: 3px; }
  .gbtn .pi { transition: transform .15s; }
  .gbtn[aria-expanded="true"] .pi { transform: rotate(180deg); }
  .sec-pass { background: #e7f4ec; color: var(--ok); }
  .sec-warn { background: #fdf0e3; color: var(--warn); }
  .sec-unrated { background: #f1f2f6; color: var(--muted); }
  .zh { background: #eef0fb; color: var(--accent); }
  .grade { color: #fff; }
  .grade-A { background: #15803d; } .grade-B { background: var(--accent); } .grade-C { background: var(--warn); } .grade-D { background: #b91c1c; }
  .tip { position: relative; cursor: default; }
  .tip:hover::after, .tip:focus-visible::after { content: attr(data-tip); position: absolute; bottom: 100%; right: 0; margin-bottom: 6px; padding: 6px 8px; background: #111827; color: #fff; font-size: 11px; font-weight: 400; border-radius: 5px; white-space: pre-line; width: max-content; max-width: min(280px, 84vw); text-align: left; line-height: 1.45; z-index: 10; pointer-events: none; }

  .gbtn { border: none; background: none; cursor: pointer; color: var(--muted); padding: 0 2px; display: inline-flex; align-items: center; }
  .gbtn:hover, .gbtn[aria-expanded="true"] { color: var(--accent); }
  .gbtn svg, .copy svg { display: block; }
  .ground-body[hidden] { display: none; }
  .ground-body { margin-top: 8px; padding: 12px 14px; background: #f9fafb; border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px; line-height: 1.6; color: var(--body); }
  .ground-body b { color: var(--fg); font-variant-numeric: tabular-nums; }
  .g-layer { margin-top: 9px; }
  .g-layer:first-child { margin-top: 0; }
  .g-h { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
  .g-sub { color: var(--muted); font-size: 11px; }
  .g-note { color: var(--muted); margin-top: 10px; font-size: 11px; border-top: 1px solid var(--line); padding-top: 8px; }
  .bad { color: var(--warn); font-weight: 600; }

  footer { max-width: 960px; margin: 0 auto 48px; padding: 0 24px; color: var(--muted); font-size: 12px; }
  footer code { background: #f1f2f6; padding: 0 4px; border-radius: 3px; }
  .empty { color: var(--muted); padding: 24px 0; }

  .install { max-width: 960px; margin: 14px auto 0; padding: 12px 24px 14px; background: #f6f7fb; border-radius: 10px; }
  .install-fold > summary { cursor: pointer; font-size: 12.5px; list-style: none; user-select: none; display: inline-flex; align-items: center; gap: 6px; }
  .install-fold > summary::-webkit-details-marker { display: none; }
  .chev { display: inline-flex; transition: transform .15s; color: var(--muted); }
  .install-fold[open] .chev { transform: rotate(90deg); }
  .install-fold > summary strong { color: var(--fg); }
  .install-fold > summary span.sub { color: var(--muted); }
  .install-fold[open] > summary { margin-bottom: 10px; }
  .install-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 9px; }
  .ins-card { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; box-shadow: 0 1px 2px rgba(17,24,39,.04); }
  .ins-t { font-size: 11px; font-weight: 600; color: var(--accent); margin-bottom: 5px; }
  .ins-card pre { margin: 0; font-size: 11px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); }
  .ins-card p.note { margin: 0; font-size: 11.5px; color: var(--body); line-height: 1.5; }
  .copy { position: absolute; top: 7px; right: 7px; display: inline-flex; align-items: center; border: 1px solid var(--line); background: #fff; border-radius: 5px; padding: 2px 4px; cursor: pointer; color: var(--muted); line-height: 1; }
  .copy:hover { color: var(--fg); border-color: var(--muted); }
  .submit-line { margin: 9px 0 0; font-size: 12.5px; color: var(--muted); }
  .submit-line a { font-weight: 600; text-decoration: none; }
  .submit-line a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <div class="lang-switch" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="zh">中</button></div>
  <h1><span class="tag">awesomeskills</span><span class="tagline" data-i18n="tagline"></span></h1>
  <p class="lede" data-i18n="lede"></p>
</header>
<section class="install" aria-labelledby="install-h">
  <details class="install-fold">
    <summary><span class="chev" aria-hidden="true"></span><strong id="install-h" data-i18n="use_title"></strong> <span class="sub" data-i18n="use_sub"></span></summary>
  <div class="install-grid">
    <div class="ins-card">

/plugin install awesomeskills@awesomeskills</pre>

<div class="bar" role="search">

<script>

      l_health: 'Health', l_security: 'Security', l_coverage: 'Coverage', l_func: 'Function / scenarios', l_community: 'Community',

      sec_pass_tip: 'security: no risky patterns found — static scan of SKILL.md only (scripts not scanned; not a safety guarantee)',
      sec_warn_tip: 'security: low-risk patterns', sec_fail_tip: 'security: high-risk patterns', sec_unrated_tip: 'security: not assessed',
      health_word: 'activity health', grade_tip: 'repo grade · overall',
      lastpush: 'last push', ago: 'ago', openissues: 'open issues', forks: 'forks', watchers: 'watchers', archived: 'archived',
      scanscope: 'scan scope', headings: 'headings', codeblocks: 'code blocks', scenarios: 'scenarios', deps: 'deps',
      repograde: 'repo', vanity: 'vanity risk', hn_stories: 'HN stories', hn_none: 'no HN discussion', bili_videos: 'Bilibili videos', bili_none: 'no Bilibili videos', plays: 'plays', notrun: 'function / community not yet run for this skill',
      note: 'Assessed by awesomeskills — health = activity+maintenance (not stars); security = static scan of SKILL.md; function & community = LLM-grounded (community is per-repo). Source: ',

      meta: (m, n, d) => `${n} 个 skill 中 ${m} 个匹配 · 索引生成于 ${d}`,

      l_health: '健康度', l_security: '安全', l_coverage: '覆盖', l_func: '功能 / 场景', l_community: '社区',
      security: '安全', chinese: '中文', yes: '是', no: '否', level: '层级', frontmatter: 'frontmatter', valid: '合规', invalid: '不合规',
      f_recency: '最近度', f_maintenance: '维护', f_engagement: '参与', f_maturity: '成熟度',
      sec_pass: '未见风险', sec_warn: '告警', sec_fail: '高风险', sec_unrated: '未评估',
      v_healthy: '健康', v_mixed: '中等', v_concern: '存疑', risk_low: '低', risk_medium: '中', risk_high: '高',
      sec_pass_tip: '安全：未见危险模式——仅 SKILL.md 静态扫描（未扫 scripts；不等于安全保证）',
      sec_warn_tip: '安全：低风险模式', sec_fail_tip: '安全：高风险模式', sec_unrated_tip: '安全：尚未评估',
      health_word: '活跃度', grade_tip: '仓库评级 · 综合',
      lastpush: '最近提交', ago: '前', openissues: '个开放 issue', forks: '个 fork', watchers: '个关注', archived: '已归档',
      scanscope: '扫描范围', headings: '个标题', codeblocks: '个代码块', scenarios: '场景', deps: '依赖',
      repograde: '仓库', vanity: 'vanity 风险', hn_stories: '条 HN 讨论', hn_none: '无 HN 讨论', bili_videos: '个 B站视频', bili_none: '无 B站视频', plays: '播放', notrun: '此 skill 尚未运行功能 / 社区分析',
      note: '由 awesomeskills 评估——health = 活跃度+维护（非 star）；security = SKILL.md 静态扫描；function 与 community = LLM 依据（community 按仓库）。来源：',
      footer_health: 'Health 为启发式（基于活跃度，非 star）。', footer_unrated: '<code>unrated</code> 安全 = 尚未评估，不等于“安全”。',
      footer_machine: '机器可读：', footer_eval: 'awesomeskills 是评估者，不是执行者——拉取的 skill 的沙箱隔离是宿主 agent 的职责。',

  let lang = localStorage.getItem('lang') || (navigator.language && navigator.language.startsWith('zh') ? 'zh' : 'en');
  const t = k => (I18N[lang] && I18N[lang][k] !== undefined) ? I18N[lang][k] : (I18N.en[k] ?? k);

  const listEl = document.getElementById('list');
  const metaEl = document.getElementById('meta');
  const liveEl = document.getElementById('live');
  const qEl = document.getElementById('q');
  const zhEl = document.getElementById('zh');
  const activeEl = document.getElementById('active');
  let skills = [], repos = {}, generatedAt = '—';
  const openRows = new Set();

  function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function secClass(s) { return s === 'pass' ? 'sec-pass' : (s === 'warn' || s === 'fail') ? 'sec-warn' : 'sec-unrated'; }
  const secLabel = r => t('sec_' + r);
  const verdictLabel = v => t('v_' + v);
  const riskLabel = x => t('risk_' + x);
  const skillSummary = e => { const fn = e.grounding && e.grounding.function && e.grounding.function[lang]; return (fn && fn.purpose) || e.summary; };
  function fmtDate(iso) { return iso ? iso.slice(0, 16).replace('T', ' ') : '—'; }

  function applyStatic() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-pre]').forEach(el => { el.textContent = t('pre_' + el.dataset.i18nPre); });
    document.querySelector('.chev').innerHTML = chevIcon;
    qEl.placeholder = t('search_ph');
    qEl.setAttribute('aria-label', t('search_aria'));
    document.querySelectorAll('.lang-switch button').forEach(b => { const on = b.dataset.lang === lang; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  }

  function layer(h, rows) { return `<div class="g-layer"><div class="g-h">${h}</div>${rows.join('')}</div>`; }

  function groundHtml(e) {
    const tr = e.trust || {}, f = tr.health_factors || {}, p = f.parts || {}, fm = e.frontmatter;
    const sf = tr.security_findings || [];
    const out = [];
    out.push(layer(t('l_health'), [
      `<div><b>${tr.health}</b> = ${t('f_recency')} ${p.recency ?? '?'}/40 · ${t('f_maintenance')} ${p.maintenance ?? '?'}/25 · ${t('f_engagement')} ${p.engagement ?? '?'}/20 · ${t('f_maturity')} ${p.maturity ?? '?'}/15</div>`,
      `<div class="g-sub">${t('lastpush')} ${f.recency_days ?? '?'}d ${t('ago')} · ${f.stars ?? '?'}★ · ${f.open_issues ?? '?'} ${t('openissues')} · ${f.forks ?? '?'} ${t('forks')} · ${f.watchers ?? '?'} ${t('watchers')}${f.archived ? ' · ' + t('archived') : ''}</div>`,
    ]));
    out.push(layer(t('l_security'), [
      `<div><b${tr.security === 'fail' ? ' class="bad"' : ''}>${esc(secLabel(tr.security))}</b>${sf.length ? ' — ' + sf.map(x => esc(x.label)).join('; ') : ''}</div>`,
      tr.security_scope ? `<div class="g-sub">${t('scanscope')}: ${esc(tr.security_scope)}</div>` : '',
    ]));
    out.push(layer(t('l_coverage'), [
      `<div>${t('chinese')}: ${tr.zh ? t('yes') : t('no')}${e.level ? ' · ' + t('level') + ': ' + esc(e.level) : ''}</div>`,
      fm ? `<div>${t('frontmatter')}: ${fm.valid ? t('valid') : '<span class="bad">' + t('invalid') + '</span>'}${fm.issues && fm.issues.length ? ' — ' + fm.issues.map(esc).join('; ') : ''}${fm.headings != null ? ` · ${fm.headings} ${t('headings')} · ${fm.code_blocks} ${t('codeblocks')}` : ''}</div>` : '',
    ]));
    const g = e.grounding, fn = g && g.function && g.function[lang];
    if (fn && fn.purpose) {
      out.push(layer(t('l_func'), [
        `<div>${esc(fn.purpose)}</div>`,
        Array.isArray(fn.scenarios) && fn.scenarios.length ? `<div class="g-sub">${t('scenarios')}: ${fn.scenarios.map(esc).join(' · ')}</div>` : '',
        Array.isArray(fn.dependencies) ? `<div class="g-sub">${t('deps')}: ${fn.dependencies.map(esc).join(', ')}${fn.boundary ? ' · ' + esc(fn.boundary) : ''}</div>` : '',
      ]));
    }
    const rp = repos[e.source_repo], co = rp && rp.community && rp.community[lang];
    if (rp && (co || rp.overall_grade)) {
      const ext = rp.external && rp.external.hn;
      out.push(layer(`${t('l_community')} — ${t('repograde')} ${esc(rp.overall_grade)} (${rp.overall_score}) · ${esc(e.source_repo)}`, [
        co && co.verdict ? `<div>${esc(verdictLabel(co.verdict))} · ${t('vanity')} ${esc(riskLabel(co.vanity_risk) || '?')}${co.summary ? ' — ' + esc(co.summary) : ''}</div>` : '',
        co && Array.isArray(co.signals) && co.signals.length ? `<div class="g-sub">${co.signals.map(esc).join(' · ')}</div>` : '',
        ext ? (ext.stories ? `<div class="g-sub">HN: ${ext.stories} ${t('hn_stories')} · ${ext.total_points ?? 0}pts / ${ext.total_comments ?? 0}c · <a href="${esc(ext.top_url)}" target="_blank" rel="noopener">top</a></div>` : `<div class="g-sub">${t('hn_none')}</div>`) : '',
        (() => { const bili = rp.external && rp.external.cn && rp.external.cn.bilibili; if (!bili) return ''; return bili.videos ? `<div class="g-sub">B站: ${bili.videos} ${t('bili_videos')} · ${esc(bili.top_plays || '')} ${t('plays')}${bili.top_url ? ` · <a href="${esc(bili.top_url)}" target="_blank" rel="noopener">${esc((bili.top_title || 'top').slice(0, 24))}</a>` : ''}</div>` : `<div class="g-sub">${t('bili_none')}</div>`; })(),
      ]));
    } else if (!fn) {
      out.push(`<div class="g-sub">${t('notrun')}</div>`);
    }
    out.push(`<div class="g-note">${t('note')}<a href="./index.json" target="_blank" rel="noopener">index.json</a></div>`);
    return out.join('');
  }

  function render() {
    const terms = qEl.value.toLowerCase().split(/\s+/).filter(Boolean);
    const rows = skills.filter(e => {
      const hay = `${e.id} ${e.name} ${e.summary} ${e.kind}`.toLowerCase();
      if (!terms.every(x => hay.includes(x))) return false;
      if (zhEl.checked && !e.trust.zh) return false;
      if (activeEl.checked && (e.trust.health || 0) < 70) return false;
      return true;
    });
    metaEl.textContent = t('meta')(rows.length, skills.length, fmtDate(generatedAt));
    if (!rows.length) { listEl.innerHTML = `<li class="empty">${t('no_match')}</li>`; return; }
    listEl.innerHTML = rows.map((e, i) => {
      const tr = e.trust, f = tr.health_factors || {}, pp = f.parts || {};
      const rp2 = repos[e.source_repo] || {};
      const htip = `${t('health_word')}\n${t('f_recency')} ${pp.recency ?? '?'}/40 · ${t('f_maintenance')} ${pp.maintenance ?? '?'}/25 · ${t('f_engagement')} ${pp.engagement ?? '?'}/20 · ${t('f_maturity')} ${pp.maturity ?? '?'}/15`;
      const fnd = (tr.security_findings || []).map(x => x.label).join('; ');
      const stip = t('sec_' + tr.security + '_tip') + (fnd ? ': ' + fnd : '');
      const grade = rp2.overall_grade;
      const gradeTip = `${t('grade_tip')} ${rp2.overall_score ?? ''}`;
      const gid = 'g' + i, open = openRows.has(e.id);
      return `<li class="row" data-id="${esc(e.id)}">
        <div class="rowmain">
          <h2 class="name"><a href="${esc(e.source_url)}" target="_blank" rel="noopener">${esc(e.name)}</a><span class="repo">${esc(e.source_repo || e.id)}</span>${e.kind && e.kind !== 'skill' ? `<span class="kind">${esc(e.kind)}</span>` : ''}</h2>
          <div class="signals">
            ${grade ? `<span class="pill grade grade-${esc(grade)} tip" tabindex="0" data-tip="${esc(gradeTip)}">${repoIcon}${esc(grade)}</span>` : ''}
            <span class="pill health tip" tabindex="0" data-tip="${esc(htip)}">${activityIcon}${tr.health}</span>
            <span class="pill ${secClass(tr.security)} icon-only tip" tabindex="0" role="img" aria-label="${esc(stip)}" data-tip="${esc(stip)}">${SEC_ICON[tr.security] || SEC_ICON.unrated}</span>
            ${tr.zh ? `<span class="pill zh">${t('chinese')}</span>` : ''}
            <button class="gbtn tip" type="button" aria-expanded="${open}" aria-controls="${gid}" aria-label="${esc(open ? t('grounding_hide') : t('grounding_show'))}" data-tip="${esc(t('grounding'))}">${chevronDownIcon}</button>
          </div>
        </div>
        ${(sm => sm ? `<div class="summary">${esc(sm)}</div>` : '')(skillSummary(e))}
        <div class="ground-body" id="${gid}" role="region" aria-label="${esc(t('grounding'))}"${open ? '' : ' hidden'}>${groundHtml(e)}</div>
      </li>`;
    }).join('');
  }

  function setLang(l) { lang = l; localStorage.setItem('lang', l); applyStatic(); render(); }

  applyStatic();
  fetch('./index.json?t=' + Date.now()).then(r => r.json()).then(data => {
    skills = (data.skills || []).slice().sort((a, b) => (b.trust.health || 0) - (a.trust.health || 0));
    repos = data.repos || {};
    generatedAt = data.generated_at || '—';
    render();
  }).catch(e => { listEl.innerHTML = `<li class="empty">Failed to load index.json: ${esc(String(e))}</li>`; });

  [qEl, zhEl, activeEl].forEach(el => el.addEventListener('input', render));
  document.querySelectorAll('.lang-switch button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

  listEl.addEventListener('click', ev => {
    const b = ev.target.closest('.gbtn');
    if (!b) return;
    const li = b.closest('.row'), body = li.querySelector('.ground-body'), id = li.dataset.id;
    const opening = body.hasAttribute('hidden');
    if (opening) { body.removeAttribute('hidden'); openRows.add(id); } else { body.setAttribute('hidden', ''); openRows.delete(id); }
    b.setAttribute('aria-expanded', opening);
    b.setAttribute('aria-label', opening ? t('grounding_hide') : t('grounding_show'));
  });

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise((res, rej) => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand('copy'); document.body.removeChild(ta);
        ok ? res() : rej();
      } catch (e) { rej(e); }
    });
  }
  document.querySelectorAll('.ins-card').forEach(card => {
    const pre = card.querySelector('pre');
    if (!pre) return;
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'copy'; btn.innerHTML = copyIcon;
    btn.setAttribute('aria-label', t('copy'));
    btn.addEventListener('click', () => {
      copyText(pre.textContent.trim())
        .then(() => { btn.innerHTML = '✓'; liveEl.textContent = t('copied'); setTimeout(() => { btn.innerHTML = copyIcon; }, 1200); })
        .catch(() => { btn.innerHTML = '✕'; liveEl.textContent = t('copy') + ' failed'; setTimeout(() => { btn.innerHTML = copyIcon; }, 1500); });
    });
    card.appendChild(btn);
  });
</script>
</body>
</html>
